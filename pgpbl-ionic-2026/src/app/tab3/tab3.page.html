<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="document-text-outline"></ion-icon> Tambah Mata Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Mata Kuliah" placeholder="Isikan nama mata kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Jam" placeholder="Isikan jam kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Dosen" placeholder="Isikan nama dosen pengampu"></ion-input>
        </ion-item>
      </ion-list>
      <ion-button>Simpan</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
